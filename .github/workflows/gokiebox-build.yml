name: Gokiebox Windows build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "client = customers (incoming only, click approval); admin = internal, private repo only"
        type: choice
        options:
          - client
          - admin
        default: client
      tag:
        description: "Release tag"
        type: string
        default: "gokiebox-1.5.3-c1"

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}
      gk-variant: ${{ inputs.variant }}
